name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: Features
    labels:
      - feature
      - enhancement
  - title: Fixes
    labels:
      - fix
      - bugfix
      - bug
  - title: Maintenance
    labels:
      - chore
      - dependencies
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
exclude-labels:
  - skip-changelog
template: |
  ## Changes

  $CHANGES
