name: secret-hygiene
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fly-tokens:
    name: Fly deploy token expiry check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.121
      - name: Fail when a deploy token expires within 21 days
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 - <<'EOF'
          import datetime
          import re
          import subprocess
          import sys

          APP = "spl-slidphilabs"
          WARN_DAYS = 21

          proc = subprocess.run(
              ["flyctl", "tokens", "list", "-a", APP],
              capture_output=True, text=True,
          )
          print(proc.stdout)
          if proc.returncode != 0:
              print(f"FAIL: could not list fly tokens for {APP}:", file=sys.stderr)
              print(proc.stderr, file=sys.stderr)
              sys.exit(1)

          # Match expiry timestamps directly instead of splitting the table:
          # flyctl pads the table with box-drawing characters whose decoding
          # varies by locale. A row carrying both EXPIRES AT and REVOKED AT
          # dates is revoked and cannot deploy, so it is skipped.
          date_re = re.compile(r"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} [+-]\d{4}")
          now = datetime.datetime.now(datetime.timezone.utc)
          limit = now + datetime.timedelta(days=WARN_DAYS)
          bad, healthy = [], 0
          for line in proc.stdout.splitlines():
              if "deploy token" not in line.lower():
                  continue
              dates = date_re.findall(line)
              if not dates:
                  print(f"WARN: no parseable expiry in row: {line.strip()[:60]}...")
                  continue
              if len(dates) > 1:
                  continue  # revoked tokens cannot deploy; ignore them
              exp = datetime.datetime.strptime(dates[0], "%Y-%m-%d %H:%M:%S %z")
              if exp <= limit:
                  bad.append(exp.isoformat())
              else:
                  healthy += 1
          if bad:
              print(f"FAIL: {len(bad)} deploy token(s) for {APP} expire within {WARN_DAYS} days:",
                    file=sys.stderr)
              for exp in bad:
                  print(f"  - expires {exp}", file=sys.stderr)
              print(f"Rotate with: flyctl tokens create deploy -a {APP}", file=sys.stderr)
              sys.exit(1)
          if healthy == 0:
              print(f"WARN: no active deploy tokens found for {APP}; deploys may be broken.")
          else:
              print(f"OK: {healthy} active deploy token(s) for {APP} expire beyond {WARN_DAYS} days.")
          EOF
