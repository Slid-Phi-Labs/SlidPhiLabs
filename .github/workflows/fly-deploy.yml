name: Deploy Slid Phi Labs to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-slidphilabs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy slidphilabs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.121

      - name: Pre-deploy test gate
        run: |
          npm ci
          npm run test:site
      - name: Deploy existing Fly app
        working-directory: docs/site
        run: flyctl deploy --remote-only --config fly.toml --app spl-slidphilabs --env GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke gate
        working-directory: docs/site
        run: |
          for i in $(seq 1 12); do
            if node scripts/smoke.mjs https://spl-slidphilabs.fly.dev; then
              exit 0
            fi
            echo "smoke attempt $i/12 failed; waiting 20s for rollout..."
            sleep 20
          done
          echo "smoke gate FAILED after 12 attempts"
          exit 1
