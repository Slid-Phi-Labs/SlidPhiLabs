name: Deploy Slid Phi Labs to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-slidphilabs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy slidphilabs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4


      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.121

      - name: Deploy existing Fly app
        working-directory: docs/site
        run: flyctl deploy --remote-only --config fly.toml --app spl-slidphilabs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
