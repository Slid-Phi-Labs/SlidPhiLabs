name: Audited checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (root + spl-pay-per-suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Root tests
        run: |
          npm ci
          npm test
      - name: spl-pay-per-suite tests
        run: |
          cd packages/spl-pay-per-suite
          npm test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scans the full git history, not only the working tree, with gitleaks'
      # maintained rule set (cloud keys, Stripe, GitHub, Anthropic, private keys and more).
      # Replaces the old hand-rolled grep scan (working tree only, no history,
      # no entropy). No .gitleaks.toml allowlist is shipped: add one only if a
      # legitimate fixture trips the scan, with a comment justifying each entry.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
